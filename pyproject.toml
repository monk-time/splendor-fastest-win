[project]
name = "splendor-fastest-win"
version = "0.1.0"
description = "Find fastest winning moves in Splendor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "more-itertools>=10.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.ruff]
target-version = "py314"
line-length = 79
preview = true
output-format = "concise" # preview mode switches this to full

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",      # pydocstyle                  (allow missing docstrings)
    "ANN",     # flake8-annotations          (demands type annotations)
    "S",       # flake8-bandit               (security testing)
    "COM",     # flake8-commas               (conflicts with formatter)
    "CPY",     # flake8-copyright            (demands copyright notices)
    "Q",       # flake8-quotes               (conflicts with formatter)
    "T20",     # flake8-print                (prohibits print statements)
    "single-line-implicit-string-concatenation",  # (conflicts with formatter)
    "blanket-type-ignore",                        # (Pylance doesn't provide error codes)
    "zip-without-explicit-strict",                # (makes zip too bulky)
    "lambda-assignment",                          # (precludes a concise functional style)
    "import-outside-top-level",                   # (sometimes imports in a function are necessary)
    "magic-value-comparison",                     # (demands too many constants)
    "missing-todo-link",                          # (too cumbersome)
    "logging-f-string",                           # (pointless micro-optimization in most cases)
    "docstring-missing-returns",                  # (excessive documentation)
    "docstring-missing-yields",                   # (excessive documentation)
]
allowed-confusables = [
    "а", "б", "в", "г", "е", "з", "и", "к", "м", "н", "о", "р", "с", "у", "ф", "х",
    "А", "Б", "В", "Г", "Е", "З", "И", "К", "М", "Н", "О", "Р", "С", "У", "Ф", "Х",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100 # don't report (E501) lines of length 80..100 that cannot be split by autoformatter

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"
parametrize-values-type = "tuple"
